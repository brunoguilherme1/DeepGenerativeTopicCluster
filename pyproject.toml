[project]
name = "vaebm-benchmark"
version = "0.1.0"
description = "Faithful reproduction of published topic-model baselines (FASTopic, GloCOM) under each paper's own protocol, compared against VAE-BM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    # No upper bound, deliberately: a <2.0 cap here was found to conflict
    # with tensorflow's own (much newer) internal numpy requirement on a
    # fresh Colab image, sending pip's resolver into a multi-minute
    # backtracking search through years of old keras/ml_dtypes/hdbscan
    # releases trying to find one old enough to accept numpy<2.0 - no code
    # in this package actually depends on numpy 1.x-only behavior.
    "numpy>=1.26",
    "scipy>=1.11",
    # Makes Python's ssl module trust the OS certificate store (not just
    # certifi's bundle) - needed on networks behind a TLS-inspecting
    # corporate proxy, where huggingface_hub/httpx downloads (sentence-
    # transformers model weights) otherwise fail certificate verification
    # even though the OS itself trusts the proxy's root CA. See
    # src/vaebm_benchmark/__init__.py.
    "truststore>=0.9",
]

[project.optional-dependencies]
# FASTopic's own reference implementation (PyPI package), plus its own
# transitive dependency `topmost` (also used directly to preprocess text
# and to run GloCOM's training loop - see models/glocom_adapter.py).
fastopic = ["fastopic>=1.0", "topmost>=1.0", "sentence-transformers>=3.0", "scikit-learn>=1.3"]
# GloCOM has no PyPI package (plain research repo) - its model is vendored
# in models/_glocom_source.py; topmost's BasicTrainer runs it, torch is
# its own compute backend, sentence-transformers builds the global
# clustering context.
glocom = ["torch>=2.0", "topmost>=1.0", "sentence-transformers>=3.0", "scikit-learn>=1.3"]
# VAE-BM: TF/Keras model given as-is by the user, BoW via scikit-learn,
# sentence embeddings via sentence-transformers.
vaebm = ["tensorflow>=2.15", "scikit-learn>=1.3", "sentence-transformers>=3.0"]
metrics = ["gensim>=4.3", "scikit-learn>=1.3"]
viz = ["matplotlib>=3.7", "pandas>=2.0", "tabulate>=0.9"]
# scripts/run_experiment.py: the simplified VAE-BM vs. BERTopic runner.
# `datasets` is only needed for the HF-backed `imdb` loader.
experiment = ["bertopic>=0.16", "sentence-transformers>=3.0", "tensorflow>=2.15", "scikit-learn>=1.3",
              "gensim>=4.3", "pandas>=2.0", "tabulate>=0.9", "datasets>=2.19"]
# scripts/run_experiment.py --experiment llm_cluster_refinement ONLY.
# Deliberately its OWN extra, not folded into `experiment` or `all` -
# bitsandbytes requires a CUDA-capable Linux/Colab environment and
# should never be forced onto a non-LLM `topic`/`cluster` experiment run
# (e.g. this project's own macOS development environment, which has no
# CUDA device and would gain nothing from installing it). Install with:
#   pip install -e ".[llm]"
llm = ["transformers>=4.44", "accelerate>=0.33", "bitsandbytes>=0.43", "sentence-transformers>=3.0",
       "torch>=2.0", "scikit-learn>=1.3", "gensim>=4.3"]
dev = ["pytest>=7.4"]
# scripts/run_experiment.py --experiment classification / --experiment
# cluster's model set (vaebm, fastopic, lda, hicot - see
# experiment/scientific_models.py). LDA needs only scikit-learn (already
# in `fastopic`/`glocom` below); HiCOT (models/hicot_adapter.py, vendored
# model in models/_hicot_source.py) needs torch + sentence-transformers,
# same as `glocom`'s own dependency set - no new package beyond what
# fastopic+glocom already declare.
scientific_experiments = ["vaebm-benchmark[fastopic,glocom,vaebm]"]
all = ["vaebm-benchmark[fastopic,glocom,vaebm,metrics,viz,experiment,scientific_experiments,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
